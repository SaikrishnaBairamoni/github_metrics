name: github-access-review

on:
  schedule:
    - cron: '0 0 1 * *'        

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r scripts/requirements.txt   # requests pyyaml pandas

      - id: date
        run: echo "value=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_READORG }}
        run: |
          python scripts/fetch_current_access.py
          mv initial_current_access.json current_access.json

      - name: Compare against baseline
        run: python scripts/compare_access.py          # → user_roles_changes.csv

      - id: diff
        run: |
          if [ $(wc -l < user_roles_changes.csv) -gt 1 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy CSV into repo
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p .github/audit_reports
          cp user_roles_changes.csv ".github/audit_reports/${{ steps.date.outputs.value }}.csv"

      - name: Open or update audit PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          branch: audit-${{ steps.date.outputs.value }}
          commit-message: Audit report ${{ steps.date.outputs.value }}
          title: GitHub access review – ${{ steps.date.outputs.value }}
          body: "@DevOps Monthly review found access changes. CSV attached in this PR."
          add-paths: .github/audit_reports/${{ steps.date.outputs.value }}.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
